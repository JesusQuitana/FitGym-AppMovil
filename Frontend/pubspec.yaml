name: fitgym
description: FitGym – App móvil de control de acceso mediante QR y gestión de membresías.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_secure_storage: ^11.2.0
  http: ^1.2.2
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  screen_brightness: ^2.1.11
  shared_preferences: ^2.3.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
